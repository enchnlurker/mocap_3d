[project]
name = "rnd-mocap-sim"
version = "0.1.0"
description = "Video mocap -> retarget -> physics validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "torch>=2.3",
    "torchvision>=0.18",
    "pillow>=10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "depth-pro @ git+https://github.com/apple/ml-depth-pro.git",
    "transformers>=5.17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
